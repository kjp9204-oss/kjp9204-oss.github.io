  <style>
    :root {
      color-scheme: light;
      --ink:#191912;
      --night:#141512;
      --paper:#f8f6ed;
      --white:#fffef8;
      --line:#d8d2bf;
      --muted:#575448;
      --gold:#ffcf09;
      --teal:#1c625c;
      font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    }
    * { box-sizing:border-box }
    body { margin:0; background:var(--paper); color:var(--ink); line-height:1.6; word-break:keep-all; overflow-wrap:anywhere }
    h1,h2,h3,p { margin:0 }
    a { color:inherit }
    a:focus-visible { outline:3px solid var(--teal); outline-offset:5px }
    img { display:block; max-width:100%; height:auto }
    .wrap { width:min(100% - 48px,1024px); margin-inline:auto }
    .topbar { background:var(--night); color:var(--white); border-bottom:3px solid var(--gold) }
    .topbar .wrap { display:flex; justify-content:space-between; align-items:center; min-height:66px; gap:16px }
    .pnp-mark { width:142px; filter:grayscale(1) invert(1) brightness(1.3); mix-blend-mode:screen }
    .topbar p { font-size:14px; font-weight:700 }
    main { padding:clamp(32px,7vw,72px) 0 55px }
    .intro { margin-bottom:29px; border-bottom:1px solid var(--line); padding-bottom:24px }
    h1 { font-size:clamp(39px,6.5vw,70px); line-height:1.13; letter-spacing:-.075em; font-weight:900 }
    .intro p { margin-top:12px; font-size:clamp(15px,2vw,18px); color:var(--muted) }
    h2 { font-size:19px; font-weight:800; margin-bottom:13px }
    .teams { list-style:none; padding:0; margin:0; display:grid; gap:15px }
    .team-card {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
      background:var(--night);
      color:var(--white);
      text-decoration:none;
      border:1px solid var(--night);
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 8px 20px #18170d1c;
    }
    .team-copy { display:grid; align-content:center; justify-items:start; padding:clamp(21px,4vw,39px); min-width:0 }
    .issue { color:var(--gold); font-size:13px; font-weight:800 }
    h3 { font-size:clamp(30px,5.2vw,50px); letter-spacing:-.065em; line-height:1.15; margin:8px 0 11px }
    .description { color:#e4dfcf; font-size:16px; line-height:1.65; max-width:24ch }
    .open-issue { display:inline-flex; align-items:center; gap:10px; padding:10px 13px; min-height:44px; background:var(--gold); color:var(--ink); font-weight:800; margin-top:20px; border-radius:5px }
    .team-card:hover .open-issue, .team-card:focus-visible .open-issue { text-decoration:underline; text-underline-offset:3px }
    .team-card figure { min-width:0; align-self:center; margin:0; padding:12px 12px 12px 0 }
    .team-card img { width:100%; aspect-ratio:600 / 335; object-fit:contain; border-radius:6px }
    footer { border-top:1px solid var(--line); color:var(--muted); font-size:13px }
    footer .wrap { padding:19px 0 }
    @media (max-width:600px) {
      .wrap { width:calc(100% - 28px) }
      .topbar .wrap { min-height:58px }
      .pnp-mark { width:120px }
      main { padding-top:26px; padding-bottom:32px }
      .intro { padding-bottom:17px; margin-bottom:19px }
      .intro p { margin-top:8px }
      .team-card { grid-template-columns:1fr }
      .team-copy { padding:19px 16px 15px }
      .team-card figure { padding:0 10px 10px }
      .description { max-width:none; font-size:15px }
      .open-issue { margin-top:13px }
    }
  </style>
</head>
