:root {
  color-scheme: light;
  --ink: #121311;
  --paper: #faf8ef;
  --accent: #ffcf09;
  --muted: #514f43;
  --line: #d6d0bc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, p { margin: 0; }
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 3px solid #0b7676; outline-offset: 4px; }
.wrap { width: min(calc(100% - 88px), 1040px); margin-inline: auto; }
.skip { position: fixed; z-index: 5; inset: 10px auto auto 10px; padding: 10px 16px; transform: translateY(-160%); background: var(--accent); }
.skip:focus { transform: none; }
.site-header { background: var(--ink); border-bottom: 3px solid var(--accent); }
.header-inner { min-height: 69px; display: flex; align-items: center; }
.pnp-logo { width: 146px; height: auto; filter: grayscale(1) invert(1) brightness(1.3); mix-blend-mode: screen; }
.masthead { border-bottom: 1px solid var(--line); padding-block: 54px 27px; }
.masthead h1 { font-size: clamp(54px, 8vw, 96px); line-height: 1.02; font-weight: 900; letter-spacing: -.09em; }
.masthead h1 span { color: #a86c00; margin-left: .045em; }
.masthead p { margin-top: 10px; color: var(--muted); font-size: 17px; }
.teams { list-style: none; display: grid; gap: 20px; margin: 24px 0 64px; padding: 0; }
.team-card {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
  border: 1px solid #24241a;
  background: var(--ink);
  color: #fffef8;
  text-decoration: none;
  box-shadow: 0 8px 20px #21140025;
}
.team-art { min-width: 0; background: #10254d; }
.team-art img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1.67; }
.team-copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: clamp(24px, 4vw, 49px); }
.issue { color: var(--accent); font-size: 14px; font-weight: 800; }
.team-copy h2 { margin-block: 3px 4px; font-size: clamp(45px, 6.4vw, 86px); font-weight: 900; letter-spacing: -.062em; line-height: 1.12; }
.team-copy p:not(.issue) { color: #efecde; font-size: 17px; }
.read { display: inline-flex; align-items: center; min-height: 44px; gap: 9px; margin-top: 12px; color: var(--accent); font-size: 15px; font-weight: 780; }
.team-card:hover .read, .team-card:focus-visible .read { text-decoration: underline; text-underline-offset: .23em; }
@media (max-width: 770px) { .wrap { width: calc(100% - 46px); } }
@media (max-width: 600px) {
  .wrap { width: calc(100% - 30px); }
  .header-inner { min-height: 57px; }
  .pnp-logo { width: 121px; }
  .masthead { padding-block: 27px 17px; }
  .masthead h1 { font-size: clamp(43px, 12vw, 62px); }
  .masthead p { margin-top: 7px; font-size: 15px; }
  .teams { gap: 15px; margin-top: 15px; }
  .team-card { grid-template-columns: minmax(0, 1fr); }
  .team-art img { height: auto; aspect-ratio: 1.92; }
  .team-copy { padding: 15px 17px 12px; }
  .team-copy p:not(.issue) { font-size: 15px; }
  .read { margin-top: 5px; }
}

</style>
